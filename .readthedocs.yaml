# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

# uv sync installs pysovist itself and the "docs" dependency group of pyproject.toml,
# so the documentation tools are listed in one place only.
python:
  install:
    - method: uv
      command: sync
      groups:
        - docs

mkdocs:
  configuration: mkdocs.yml
  fail_on_warning: true
