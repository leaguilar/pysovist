site_name: pysovist
site_description: Exact isovists and view volumes from floor plans, meshes and raw point clouds
site_author: Leonel Aguilar and Bartu Tuncay
site_url: !ENV READTHEDOCS_CANONICAL_URL
repo_url: https://github.com/leaguilar/pysovist
repo_name: leaguilar/pysovist
copyright: Copyright (c) 2025-2026 Bartu Tuncay and Leonel Aguilar. MIT licence.

theme:
  name: material
  features:
    - content.code.copy
    - navigation.footer
    - navigation.sections
    - navigation.top
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

nav:
  - Home: index.md
  - Quick start: quickstart.md
  - Conventions: conventions.md
  - Metric definitions: metrics.md
  - Verification: verification.md
  - Unity compatibility: unity.md
  - API reference:
      - 2D isovists: api/isovists.md
      - 3D view volumes: api/volumes.md
      - Ray directions: api/directions.md
      - Unity preset: api/unity.md
      - Command line: api/cli.md
  - How to cite: cite.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          options:
            docstring_section_style: list
            docstring_style: numpy
            filters: ["!^_"]
            heading_level: 2
            line_length: 80
            members_order: source
            merge_init_into_class: true
            separate_signature: true
            show_if_no_docstring: true
            show_root_full_path: false
            show_root_heading: true
            show_source: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
